<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c5cbf"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Gradient ring -->
  <rect width="512" height="512" rx="110" fill="none" stroke="url(#ring)" stroke-width="16"/>
  <!-- Wolf emoji rendered as text -->
  <text x="256" y="340" font-size="280" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">🐺</text>
  <!-- WOLFPACK text -->
  <text x="256" y="460" font-size="58" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" letter-spacing="8" fill="#7c5cbf">WOLFPACK</text>
</svg>